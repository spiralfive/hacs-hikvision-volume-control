set_speaker_volume:
  name: Set Speaker Volume
  description: Set the speaker volume level for a HikVision camera
  fields:
    volume:
      name: Volume
      description: Volume level (0-100)
      required: true
      example: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

set_microphone_volume:
  name: Set Microphone Volume
  description: Set the microphone volume level for a HikVision camera
  fields:
    volume:
      name: Volume
      description: Volume level (0-100)
      required: true
      example: 45
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

set_both_volumes:
  name: Set Both Volumes
  description: Set both speaker and microphone volume levels for a HikVision camera
  fields:
    speaker_volume:
      name: Speaker Volume
      description: Volume level for speaker (0-100)
      required: true
      example: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    microphone_volume:
      name: Microphone Volume
      description: Volume level for microphone (0-100)
      required: true
      example: 45
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"